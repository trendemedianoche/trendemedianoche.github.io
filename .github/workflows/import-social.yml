name: Importar Instagram y Facebook al blog

on:
  schedule:
    - cron: '40 * * * *' # cada hora (GitHub suele saltarse ejecuciones; las historias duran 24 h)
  workflow_dispatch:       # permite ejecutarlo manualmente
    inputs:
      rescan:
        description: 'Volver a buscar fechas en todo (reemplaza las fechas por revisar)'
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Importar publicaciones
        env:
          SUPABASE_URL: https://gleaiedraisdtoyrnbmq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          SOCIAL_AUTO_PUBLISH: ${{ vars.SOCIAL_AUTO_PUBLISH }}
          EVENTS_RESCAN: ${{ inputs.rescan }}
        run: node scripts/import-social.mjs
